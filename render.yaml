services:
  - type: web
    name: onecol-orders
    runtime: python
    buildCommand: python -m pip install -r requirements.txt
    startCommand: python bot.py
    healthCheckPath: /
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: ADMIN_CHAT_ID
        sync: false
      - key: ORDERS_DB_PATH
        value: /tmp/orders.db
      - key: PORT
        value: 10000
